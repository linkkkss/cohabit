<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff2df" />
    <meta name="description" content="Cohabit UI concept：白粉、深灰与爱马仕橙的校园组寝界面。" />
    <title>Cohabit · 校园组寝 UI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 首屏骨架：Vue 挂载前的静态占位，带一道流光扫过；挂载后随 #app 一起被替换 */
      :root {
        --boot-paper: #fff2df;
        --boot-raised: #fffaf1;
        --boot-sand: #f4e6d0;
        --boot-sand-deep: #e8d6ba;
        --boot-line: #e9d6b9;
        --boot-ink: #363636;
        --boot-coral: #ff8a00;
        --boot-ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      html {
        background: var(--boot-paper);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--boot-paper);
        background-image:
          linear-gradient(to right, rgba(54, 54, 54, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(54, 54, 54, 0.045) 1px, transparent 1px);
        background-size: 56px 56px;
        color: var(--boot-ink);
        font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .boot {
        position: relative;
        overflow: hidden;
        max-width: 1120px;
        margin: 0 auto;
        padding: 26px 24px 80px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .boot__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--boot-ink);
      }
      .boot__brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boot__mark {
        width: 34px;
        height: 34px;
        border: 2px solid var(--boot-ink);
        border-radius: 2px;
        background: var(--boot-coral);
        box-shadow: 2px 2px 0 var(--boot-ink);
      }
      .boot__nav {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border: 2px solid var(--boot-ink);
        border-radius: 999px;
        background: var(--boot-raised);
        box-shadow: 3px 3px 0 var(--boot-ink);
      }
      .boot__nav span {
        display: block;
        width: 62px;
        height: 26px;
        border-radius: 999px;
        background: var(--boot-sand);
      }
      .boot__nav span:first-child {
        width: 54px;
        background: var(--boot-ink);
      }

      .boot__line,
      .boot__block,
      .boot__pill {
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--boot-sand), var(--boot-sand-deep));
      }
      .boot__line::after,
      .boot__block::after,
      .boot__pill::after,
      .boot__card::after,
      .boot__disc::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 32%,
          rgba(255, 255, 255, 0.72) 50%,
          transparent 68%
        );
        transform: translateX(-120%);
        animation: boot-sweep 1.9s var(--boot-ease) infinite;
      }

      .boot__hero {
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        gap: clamp(28px, 5vw, 64px);
        align-items: center;
        margin-top: 62px;
      }
      .boot__pill {
        display: block;
        width: 132px;
        height: 24px;
      }
      .boot__title {
        margin: 26px 0 22px;
        display: grid;
        gap: 12px;
      }
      .boot__title .boot__line {
        height: 48px;
        border-radius: 4px;
      }
      .boot__title .boot__line:last-child {
        width: 66%;
      }
      .boot__text {
        display: grid;
        gap: 10px;
        margin-bottom: 30px;
      }
      .boot__text .boot__line {
        height: 12px;
        border-radius: 3px;
      }
      .boot__text .boot__line:nth-child(2) {
        width: 92%;
      }
      .boot__text .boot__line:nth-child(3) {
        width: 64%;
      }
      .boot__cta {
        display: flex;
        gap: 12px;
      }
      .boot__cta .boot__pill {
        width: 152px;
        height: 46px;
        border-radius: 2px;
      }
      .boot__cta .boot__pill--cta {
        background: linear-gradient(180deg, #ffa63f, var(--boot-coral));
      }
      .boot__cta .boot__pill--ghost {
        width: 128px;
        border: 2px solid var(--boot-line);
        background: var(--boot-raised);
      }
      .boot__ticks {
        display: flex;
        gap: 18px;
        margin-top: 26px;
      }
      .boot__ticks .boot__line {
        width: 84px;
        height: 10px;
        border-radius: 2px;
      }

      .boot__art {
        position: relative;
        min-height: 380px;
      }
      .boot__disc {
        position: absolute;
        top: -8%;
        right: 10%;
        width: 300px;
        height: 300px;
        border: 1.5px dashed color-mix(in srgb, var(--boot-ink) 26%, transparent);
        border-radius: 50%;
      }
      .boot__card {
        position: absolute;
        top: 8%;
        right: 6%;
        width: min(320px, 88%);
        aspect-ratio: 0.8;
        border: 2px solid var(--boot-ink);
        border-radius: 18px;
        background: linear-gradient(168deg, var(--boot-raised), #f3e2c9);
        box-shadow: 8px 8px 0 var(--boot-ink);
        overflow: hidden;
        transform: rotate(-2.4deg);
      }
      .boot__card-inner {
        position: absolute;
        inset: 10px;
        border: 1.5px solid var(--boot-line);
        border-radius: 12px;
        overflow: hidden;
        background:
          radial-gradient(60% 34% at 50% 12%, #fff6e8, transparent 70%),
          linear-gradient(180deg, var(--boot-raised), #efdcc0);
      }
      .boot__card-inner::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 46%;
        width: 64%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(160deg, #ffab3d, var(--boot-coral));
        transform: translate(-50%, -50%);
        opacity: 0.92;
      }
      .boot__card-inner::after {
        content: "";
        position: absolute;
        left: 14%;
        right: 14%;
        bottom: 16%;
        height: 26%;
        border-top: 1.5px solid var(--boot-line);
        background: linear-gradient(180deg, rgba(255, 250, 241, 0), var(--boot-raised) 42%);
      }
      .boot__chip {
        position: absolute;
        z-index: 2;
        height: 34px;
        border: 2px solid var(--boot-ink);
        border-radius: 2px;
        background: var(--boot-raised);
        box-shadow: 3px 3px 0 var(--boot-ink);
      }
      .boot__chip--score {
        top: -4%;
        left: 2%;
        width: 96px;
      }
      .boot__chip--tag {
        top: 24%;
        right: 0;
        width: 88px;
      }
      .boot__stamp {
        position: absolute;
        right: 4%;
        bottom: 0;
        width: 84px;
        height: 44px;
        border: 1.5px solid var(--boot-line);
        background: var(--boot-raised);
        transform: rotate(-6deg);
      }

      .boot__grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 86px;
        padding-top: 30px;
        border-top: 2px solid var(--boot-ink);
      }
      .boot__block {
        height: 168px;
        border: 2px solid var(--boot-ink);
        border-radius: 4px;
        background: linear-gradient(180deg, var(--boot-raised), var(--boot-sand));
        box-shadow: 6px 6px 0 color-mix(in srgb, var(--boot-ink) 10%, transparent);
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-120%);
        }
        55%,
        100% {
          transform: translateX(120%);
        }
      }

      @media (max-width: 900px) {
        .boot__nav {
          display: none;
        }
        .boot__hero {
          grid-template-columns: 1fr;
          margin-top: 40px;
        }
        .boot__art {
          min-height: 320px;
        }
        .boot__grid {
          grid-template-columns: 1fr;
        }
        .boot__block {
          height: 120px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__line::after,
        .boot__block::after,
        .boot__pill::after,
        .boot__card::after,
        .boot__disc::after {
          animation: none;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite" aria-label="页面加载中">
        <div class="boot__bar">
          <div class="boot__brand">
            <span class="boot__mark"></span>
            <span class="boot__line" style="width: 84px; height: 16px"></span>
          </div>
          <div class="boot__nav" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="boot__line" style="width: 96px; height: 34px"></span>
        </div>

        <div class="boot__hero" aria-hidden="true">
          <div>
            <span class="boot__pill"></span>
            <div class="boot__title">
              <div class="boot__line"></div>
              <div class="boot__line"></div>
            </div>
            <div class="boot__text">
              <div class="boot__line"></div>
              <div class="boot__line"></div>
              <div class="boot__line"></div>
            </div>
            <div class="boot__cta">
              <span class="boot__pill boot__pill--cta"></span>
              <span class="boot__pill boot__pill--ghost"></span>
            </div>
            <div class="boot__ticks">
              <span class="boot__line"></span>
              <span class="boot__line"></span>
              <span class="boot__line"></span>
            </div>
          </div>

          <div class="boot__art">
            <div class="boot__disc"></div>
            <div class="boot__card">
              <div class="boot__card-inner"></div>
            </div>
            <span class="boot__chip boot__chip--score"></span>
            <span class="boot__chip boot__chip--tag"></span>
            <span class="boot__stamp"></span>
          </div>
        </div>

        <div class="boot__grid" aria-hidden="true">
          <div class="boot__block"></div>
          <div class="boot__block"></div>
          <div class="boot__block"></div>
        </div>
        <span class="sr-only">正在加载页面内容…</span>
      </div>
    </div>
    <noscript>
      <div style="max-width: 560px; margin: 80px auto; padding: 0 24px">
        Cohabit 需要开启 JavaScript 才能使用，请在浏览器设置中允许后刷新。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
